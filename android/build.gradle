// Cinefly fork of iawtk2302/easy_video_editor (MIT). See FORK.md at the repository root.
//
// The legacy `buildscript` block (pinned to AGP 7.3.0 / Kotlin 1.7.10) and the
// `allprojects` repositories block were removed: when this plugin is consumed as
// an included subproject, the consuming app's AGP and repositories govern the
// build. For standalone builds of this directory, the AGP version and
// repositories come from settings.gradle's pluginManagement block.

plugins {
    id "com.android.library"
}

group = "com.example.easy_video_editor"
version = "1.0-SNAPSHOT"

// From AGP 9 onward Kotlin can be compiled by AGP's built-in Kotlin, and
// applying org.jetbrains.kotlin.android on top of that is a hard error. So the
// plugin is applied only when built-in Kotlin is not in play.
//
// Checking android.builtInKotlin — not just the AGP major version — matters.
// A consuming app can be on AGP 9 and still run with android.builtInKotlin=false,
// which is exactly what Flutter 3.47's own project template ships. Gating on
// `agpMajor < 9` alone (as stripe_android does) leaves jvmTarget unset in that
// combination, so the module's Kotlin target silently tracks the JDK running
// Gradle instead of the Java 17 declared below.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = project.findProperty('android.builtInKotlin')?.toString()?.toBoolean() ?: false
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace = "com.example.easy_video_editor"
    compileSdk = 37

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.1.1")

        // Media3 dependencies
        implementation "androidx.media3:media3-common:1.4.1"
        implementation("androidx.media3:media3-transformer:1.4.1")
        implementation("androidx.media3:media3-muxer:1.4.1")

        // Coroutines
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")

        implementation("com.otaliastudios:transcoder:0.10.5")
    }

    lint {
        disable 'InvalidPackage'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

// Only meaningful while KGP is applied. Under built-in Kotlin, AGP derives the
// JVM target from compileOptions.targetCompatibility above, and the `kotlin`
// extension this block configures does not exist.
if (agpMajor < 9 || !builtInKotlin) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

