// Cinefly fork of iawtk2302/easy_video_editor (MIT). See FORK.md at the repository root.
//
// The legacy `buildscript` block (pinned to AGP 7.3.0 / Kotlin 1.7.10) and the
// `allprojects` repositories block were removed: when this plugin is consumed as
// an included subproject, the consuming app's AGP and repositories govern the
// build. For standalone builds of this directory, the AGP version and
// repositories come from settings.gradle's pluginManagement block.

plugins {
    id "com.android.library"
    id "kotlin-android"
}

group = "com.example.easy_video_editor"
version = "1.0-SNAPSHOT"

android {
    namespace = "com.example.easy_video_editor"
    compileSdk = 37

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.1.1")

        // Media3 dependencies
        implementation "androidx.media3:media3-common:1.4.1"
        implementation("androidx.media3:media3-transformer:1.4.1")
        implementation("androidx.media3:media3-muxer:1.4.1")

        // Coroutines
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")

        implementation("com.otaliastudios:transcoder:0.10.5")
    }

    lint {
        disable 'InvalidPackage'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}
